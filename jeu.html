<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Jeu Livre - Test</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="conteneur">
    <div class="entete-jeu">
      <span>Mode test (sans compte)</span>
    </div>

    <div class="carte chapitre">
      <h2 id="chapitre-titre"></h2>
      <img id="chapitre-image" src="" alt="" style="display:none;">
      <p id="chapitre-texte"></p>

      <div id="choix-container" class="choix-container"></div>
    </div>
  </div>

  <!-- Barre fixe du bas -->
  <div class="barre-bas">
    <button class="barre-bouton" data-panneau="stats">
      <span class="barre-icone">⚔️</span>
      <span class="barre-label">Stats</span>
    </button>
    <button class="barre-bouton" data-panneau="inventaire">
      <span class="barre-icone">🎒</span>
      <span class="barre-label">Inventaire</span>
    </button>
    <button class="barre-bouton" data-panneau="compagnons">
      <span class="barre-icone">🧑‍🤝‍🧑</span>
      <span class="barre-label">Compagnons</span>
    </button>
  </div>

  <!-- Panneau popup (stats / inventaire / compagnons) -->
  <div id="panneau-overlay" class="panneau-overlay">
    <div class="panneau">
      <div class="panneau-entete">
        <h3 id="panneau-titre"></h3>
        <button id="panneau-fermer" class="panneau-fermer">✕</button>
      </div>
      <div id="panneau-contenu" class="panneau-contenu"></div>
    </div>
  </div>

  <script src="js/joueur.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
